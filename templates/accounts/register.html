{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh; padding: 40px 0;">
    <div class="glass-panel p-5" style="width: 100%; max-width: 500px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-gradient">Create Account</h2>
            <p class="text-muted">Join FlowAI for Smart Traffic Management</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} bg-dark text-light border-secondary">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-muted">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="name" class="form-control bg-dark border-secondary text-light" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-dark border-secondary text-light" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-dark border-secondary text-light" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="confirm_password" class="form-control bg-dark border-secondary text-light" required>
                </div>
            </div>
            <button type="submit" class="btn btn-glow w-100 mb-3">Register</button>
            <div class="text-center">
                <p class="text-muted mb-0">Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none">Login here</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
